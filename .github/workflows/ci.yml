name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

# Windows é a plataforma principal de produção: quebrar o build Windows é
# tratado como build quebrado (Seção 8 do plano).
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            preset: mac-debug
          - name: Windows
            os: windows-2022
            preset: win-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Ninja + MSVC precisa do ambiente de desenvolvedor do Visual Studio no PATH.
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Usa o vcpkg já pré-instalado nos runners (evita bootstrap frágil).
      - name: Point to preinstalled vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Preenche builtin-baseline no manifesto conforme a árvore de ports do
      # runner (só no CI; não é commitado).
      - name: Pin vcpkg baseline
        shell: bash
        run: "$VCPKG_INSTALLATION_ROOT/vcpkg x-update-baseline --add-initial-baseline"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
